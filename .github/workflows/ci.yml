name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostics:
    name: Diagnostics (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m mcforge self-test
      - run: python scripts/package.py
      - run: python scripts/verify_package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'windows-latest' && matrix.python == '3.14'
        with:
          name: Minecraft-Forge-WIP
          path: dist/*
          if-no-files-found: error
  hygiene:
    name: Release hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_hygiene.py
  neoforge-build:
    name: NeoForge 1.21.1 build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: New-Item -ItemType Directory -Force local | Out-Null
      - run: python -m mcforge init local/ci-mod --mod-id ciprobe --package dev.mcforge.ciprobe --name 'CI Probe' --with-tests
      - run: python -m mcforge doctor --project local/ci-mod
      - run: python -m mcforge quickstart local/ci-quick --mod-id ciquick --package dev.mcforge.ciquick --name 'CI Quick' --no-tests --style metal
      - run: python -m mcforge doctor --project local/ci-quick
      - run: python -m mcforge asset local/ci-mod --id ruby_block:block --id ruby:item --style gem --size 32
      - run: python -m mcforge gradle local/ci-mod tasks --all
      - run: python -m mcforge verify local/ci-mod --starter
      - run: python -m mcforge verify local/ci-mod --check
      - run: python -m mcforge gradle local/ci-mod createMinecraftArtifacts
        env:
          CI: 'false' # ModDevGradle omits source artifacts when CI=true.
      - run: python -m mcforge sources --project local/ci-mod
      - run: python -m mcforge jar local/ci-mod/build/libs/ciprobe-1.0.0.jar --hash
      - run: python -c "import zipfile; names=zipfile.ZipFile('local/ci-mod/build/libs/ciprobe-1.0.0.jar').namelist(); assert 'assets/ciprobe/textures/block/ruby_block.png' in names; assert 'assets/ciprobe/textures/item/ruby.png' in names; print('generated assets present')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: NeoForge-verification
          path: local/ci-mod/build/mcforge/
          if-no-files-found: warn
